<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sem conexão — AlfaAltoGrup</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0f1115;
      color: #e6e8ec;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .caixa { max-width: 380px; }
    .icone {
      width: 64px; height: 64px; margin: 0 auto 20px;
      border-radius: 50%;
      background: rgba(239, 68, 68, .12);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0 0 20px; color: #9aa1ad; font-size: 14px; }
    button {
      font: inherit; font-size: 14px; font-weight: 500;
      padding: 10px 20px; border-radius: 10px; cursor: pointer;
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.06); color: inherit;
    }
    button:hover { background: rgba(255,255,255,.12); }
  </style>
</head>
<body>
  <div class="caixa">
    <div class="icone">📡</div>
    <h1>Sem conexão</h1>
    <p>
      O painel precisa de internet para falar com o WhatsApp. Os agendamentos
      já criados continuam sendo enviados normalmente pelo servidor.
    </p>
    <button onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
